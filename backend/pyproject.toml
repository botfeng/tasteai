[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tasteai-backend"
version = "0.1.0"
description = "TasteAI API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
